name: security-and-tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan (working tree + history)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Install pinned gitleaks
        run: |
          curl -sSfL -o /tmp/gitleaks.tgz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf /tmp/gitleaks.tgz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan working tree (no git)
        run: gitleaks detect --no-git --redact

      - name: Scan full git history
        run: gitleaks detect --redact

  tests:
    name: Tests (SDK reellement livre)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      # La CI a longtemps installe un `requirements.txt` anterieur a la migration
      # MCP v2 : elle restait verte en testant un SDK que la production n utilisait
      # plus. Ce garde-fou echoue si le depot et la version epinglee divergent.
      - name: Verifier que le SDK installe est celui epingle
        run: |
          python - <<'PY'
          import re
          from importlib.metadata import version
          from pathlib import Path

          epingle = dict(
              re.findall(r"^([A-Za-z0-9_.-]+)==([^\s#]+)", Path("requirements.in").read_text(), re.M)
          )
          for paquet in ("mcp", "uvicorn", "starlette", "pydantic", "httpx", "numpy", "fastembed"):
              attendu, installe = epingle[paquet], version(paquet)
              assert attendu == installe, f"{paquet}: epingle {attendu}, installe {installe}"
              print(f"{paquet} {installe} OK")
          PY

      # `test_auth.py` demande l environnement de production (autorite CA) : hors CI.
      - name: Suite complete
        run: python -m pytest tests -q --ignore=tests/test_auth.py

  reproductible:
    name: Rebuild a hashes (arch de production)
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      # Le lockfile est compile sur l arch de production (arm64, Python 3.12) :
      # ce job est le seul endroit ou `--require-hashes` a un sens, et c est lui
      # qui prouve qu un environnement de production se reconstruit a l identique.
      - name: Installer depuis le lockfile a hashes
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock
          pip check

      - name: Suite complete
        run: |
          pip install pytest pytest-asyncio
          python -m pytest tests -q --ignore=tests/test_auth.py
