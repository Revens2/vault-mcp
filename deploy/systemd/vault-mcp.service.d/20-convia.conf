# File d attente ConvIA (pending_analysis). Le service tourne sous ProtectSystem=strict :
# sans cette ouverture ciblee, sqlite rend « unable to open database file ». On ouvre
# UN repertoire, pas /var/lib.
[Service]
StateDirectory=vault-mcp
ReadWritePaths=/var/lib/vault-mcp
Environment=CONVIA_QUEUE_DB=/var/lib/vault-mcp/convia.db
Environment=CONVIA_RAW_ROOT=/srv/vault-mirror/raw/assets/ConvIA
Environment=WIKI_INGEST_UNIT=llm-wiki-ingest.service
