# Ingestion Wiki ChatGPT-seul (wiki_ingest_contract / submit / merge_pending).
#
# - Spool d'extraction, lu par llm_wiki_merge (llmingest:llmwiki) : seul chemin
#   de /var/lib/llm-wiki ouvert en ecriture. Sans lui, ProtectSystem=strict le
#   laissait en lecture seule et tout submit valide echouait en EROFS.
# - Journal interne de merge_pending : dans l'etat propre du service (aucun
#   autre lecteur), plutot que d'ouvrir /var/lib/llm-wiki entier.
# - Contrat canonique et wiki : lecture seule (ProtectSystem=strict suffit).
[Service]
ReadWritePaths=/var/lib/llm-wiki/spool/extract
Environment=WIKI_JOBS_MANIFEST=/var/lib/vault-mcp/wiki_jobs_manifest.jsonl
Environment=WIKI_CONTRACT_MODULE=/usr/local/bin/llm_wiki_extract.py
Environment=WIKI_NOTES_DIR=/srv/obsidian-vault/wiki
