# Garde-fous memoire vault-mcp (incident fuite 2026-09-21).
#
# Contexte : la stack RAG retenait ~350 Mo de metas Python + des rebuilds BM25
# de plusieurs Go a chaque publish incrementale, jusqu'a 12 Go RSS sur 23 Go.
# Apres correctifs (stale-abort BM25 + cache embeddings par thread), le regime
# mesure est : plateau ~3.7 Go, sawtooth borne par publish ~5.7-6.3 Go,
# pic transitoire de build ~7.5 Go.
#
# MemoryHigh=7G : pression douce (throttle + reclaim) pendant les pics de build.
# MemoryMax=8G : garde-fou strict, restart borne en cas de regression.
# Ne pas baisser sans refaire un soak >= 200 recherches + 2 publishes.
[Service]
MemoryHigh=7G
MemoryMax=8G
