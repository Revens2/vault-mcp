# Stabilisation 22/09/2026 — incident OOM 7.9G + swap 2.7G malgre f82a721.
#
# - VAULT_MCP_THREADS=2 : borne ONNX intra_op (service tournait en threads=None
#   = tous coeurs, amplifiant les pics concurrents ; worker/full deja a 2).
# - MemorySwapMax=1G : empeche le swap-thrash de plusieurs heures observe
#   (MemorySwapMax=infinity + swap 1.6/4G, Recv-Q accumule, timeouts 20-25s).
#   Avec 1G, la pression swap declenche reclaim/OOM borne au lieu de thrasher.
# - MemoryHigh/Max inchanges (7G/8G) : compatibles index 352k fragments,
#   vectors 517M, pic build 5.4G mesure. Ne pas baisser sans soak.
# Rollback : supprimer ce fichier + daemon-reload + try-restart (backup
# /root/vault-mcp-rollback-20260922T175627Z).
[Service]
Environment=VAULT_MCP_THREADS=2
MemorySwapMax=1G
