# Fiabilisation 29/09/2026 -- figements 27/09 et 28/09 (RSS 7.3G, swap plein,
# HTTP 000, SIGTERM ignore 180 s puis SIGKILL).
# - MALLOC_ARENA_MAX=2 : glibc ne garde plus 1 arena par thread anyio ; les
#   paliers de RSS a chaque publication (json.loads de meta.json 161 Mo) etaient
#   de la fragmentation, pas des objets vivants.
# - MemoryHigh=infinity + MemorySwapMax=0 : plus de reclaim/swap-thrash qui fige
#   le processus sans le tuer. Au-dela de MemoryMax -> OOM-kill net, Restart=always.
# - TimeoutStopSec=20s : le handler SIGTERM Python ne tourne pas quand le process
#   est bloque ; inutile d'attendre 3 min (arret force deja juge sur, cf server.py).
# Rollback : supprimer ce fichier + daemon-reload + restart vault-mcp
# (sauvegarde /root/rag-fix-20260929).
[Service]
Environment=MALLOC_ARENA_MAX=2
Environment=MALLOC_TRIM_THRESHOLD_=131072
MemoryHigh=infinity
MemoryMax=7G
MemorySwapMax=0
TimeoutStopSec=20s
