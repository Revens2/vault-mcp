# Plafonnement CPU de la reindexation (mission contention CPU -> 502 MCP, 2026-09-07).
# VAULT_MCP_THREADS=3 -> 2 : c'est le SEUL levier reconnu par onnxruntime
# (OMP/ORT_NUM_THREADS de l'unite de base sont inertes, cf. vault_mcp/embed.py).
# CPUQuota=200% : garde-fou dur sur cette machine 4 vCPU partagee avec les MCP
# interactifs (reindex observe a ~2,8 cœurs avant plafonnement).
# TimeoutStartSec passe a 6 h : a 2 cœurs la duree reelle est ~2x celle mesuree
# a 2,8 cœurs ; 2 h (valeur de base) tuerait le job avant la fin.
# CPUWeight=20 + Nice=15 + IOSchedulingClass=idle restent actifs (unite de base).
[Service]
Environment=VAULT_MCP_THREADS=2
CPUQuota=200%
TimeoutStartSec=6h
