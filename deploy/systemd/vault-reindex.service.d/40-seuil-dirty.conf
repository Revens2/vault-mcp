# Fix EROFS seuil reconciliation (forensic worker 22/09/2026).
#
# Le full ne pouvait pas poser le seuil : ReadOnlyPaths=/srv/vault-mirror +
# ReadWritePaths=/opt/vault-mcp/index seul →
# `[Errno 30] Read-only file system: '/srv/vault-spool/dirty/.seuil.tmp.*'`
# Seuil fige au 15/09 → reconciliation 5084 ecarts > 2000, `laisse au full`
# toutes les 10 min sans jamais avancer.
# Ajoute /srv/vault-spool/dirty en ecriture (meme ouverture que le worker).
# Rollback : supprimer ce fichier + daemon-reload (backup /root/...).
[Service]
ReadWritePaths=/srv/vault-spool/dirty
